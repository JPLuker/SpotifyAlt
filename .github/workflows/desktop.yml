name: Desktop CI

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'extension/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'extension/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Smoke test (real app, sandboxed renderer, Widevine required)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          # Ubuntu 24.04 limits unprivileged user namespaces; Electron's dev binary needs the SUID helper.
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          SMOKE_REQUIRE_WIDEVINE=1 xvfb-run -a npm run smoke
      - name: Keep smoke screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-output
          path: desktop/test-output/
          if-no-files-found: warn
      - name: Dependency check (high and critical block)
        run: npm audit --omit=dev --audit-level=high

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -y -q rpm zip
      - run: npx electron-builder --linux AppImage deb rpm tar.gz --x64
      - name: Chrome extension zip
        run: |
          v=$(node -p "require('./package.json').version")
          (cd ../extension && zip -r -X "../desktop/dist/Heartline-$v-Extension.zip" .)
      - name: Check required files
        run: bash scripts/check-assets.sh linux dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            desktop/dist/Heartline-*-Linux-*
            desktop/dist/Heartline-*-Extension.zip
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          # The MSI needs an app icon (WiX fails without one). The icon is Joseph's art (issue #3),
          # so the MSI is built once build/icons/256x256.png exists.
          if [[ -s build/icons/256x256.png ]]; then
            npx electron-builder --win nsis msi portable --x64 -c.win.icon=build/icons/256x256.png
          else
            echo "::warning::No app icon yet, skipping the MSI (issue #3)"
            npx electron-builder --win nsis portable --x64
          fi
      - name: Check required files
        shell: bash
        run: bash scripts/check-assets.sh windows dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: desktop/dist/Heartline-*-Windows-*
          if-no-files-found: error
