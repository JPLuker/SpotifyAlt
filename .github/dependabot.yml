version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # castLabs Electron comes from GitHub, not npm. Bump it by hand (see CLAUDE.md).
      - dependency-name: electron
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
