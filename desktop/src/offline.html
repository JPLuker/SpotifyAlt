<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta http-equiv="refresh" content="15;url=https://open.spotify.com/">
<title>Heartline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #121212; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  a { display: inline-block; min-height: 40px; line-height: 40px; padding: 0 24px; border-radius: 20px; background: #fff; color: #000; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach Spotify</h1>
  <a href="https://open.spotify.com/">Try again</a>
</main>
</body>
</html>
